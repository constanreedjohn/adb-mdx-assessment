# Normal end-of-day playbook (owner: core; plan §2.5, PDF §2.1). The default playbook.
# One follow-up is allowed: the teacher's send-back of named flags to the Market Data
# Assessment Agent (E6-05), decided at a review point, never planned. More follow-ups
# arrive in SP9 (E10-08): compare a file with the prior day's, fetch longer history or
# related curves, re-assess one item.

id: normal_eod
version: "1"
title: Normal end-of-day
description: >-
  Input validation, market data assessment, escalation and reporting, with a review
  point after each step and the Master Agent's review and run opinion at the end.

selected_when:
  default: true
precedence: 4         # lowest priority: runs when no other playbook's rule holds

# Every plan must include these tasks: every dataset assessed, every output reviewed.
mandatory_steps:
  - input_validation.check_files_and_intake
  - market_data.near_zero_check
  - escalation_reporting.record_cases

allowed_follow_ups:
  - market_data.revise_drafts   # send-back only (max_send_backs)

limits:
  max_follow_up_rounds: 0    # follow-ups the Master may plan up front
  max_send_backs: 1          # follow-ups review points may decide during the run
  max_run_seconds: 600
  max_ai_explanations: 100

# Runs when Master planning fails (PDF §3.3 safe failure; plan D-10).
default_plan:
  - {step_id: validate_inputs, task: input_validation.check_files_and_intake}
  - {step_id: assess_movements, task: market_data.near_zero_check}
  - {step_id: record_cases, task: escalation_reporting.record_cases}
